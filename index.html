

<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Puzzle Game</title><style>body{font-family:Tahoma,Arial;text-align:center;background:#eef2ff;margin:0;padding:20px}h1{color:#4338ca}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:330px;margin:20px auto}.tile{background:#6366f1;color:white;font-size:30px;font-weight:bold;border:0;border-radius:10px;aspect-ratio:1;cursor:pointer}.empty{background:#dbeafe;color:transparent}button.action{background:#16a34a;color:white;border:0;border-radius:10px;padding:12px 20px;font-size:17px;margin:5px}#msg{margin:15px}</style></head><body><h1>🎮 بازی پازل</h1><p>عددها رو به ترتیب از ۱ تا ۸ مرتب کن!</p><div id="board" class="board"></div><p id="msg">برای شروع روی «شروع بازی» بزن.</p><button class="action" onclick="start()">شروع بازی</button><button class="action" onclick="moveEmpty()">راهنما</button><script>let a=[];function start(){a=[1,2,3,4,5,6,7,8,0];for(let i=0;i<100;i++){let e=a.indexOf(0),n=[e-3,e+3];if(e%3)n.push(e-1);if(e%3<2)n.push(e+1);let j=n[Math.floor(Math.random()*n.length)];[a[e],a[j]]=[a[j],a[e]]}render();document.getElementById('msg').textContent='خانه‌های کنار جای خالی را جابه‌جا کن.'}function render(){let b=document.getElementById('board');b.innerHTML='';a.forEach((v,i)=>{let t=document.createElement('button');t.className='tile'+(v===0?' empty':'');t.textContent=v||'';t.onclick=()=>play(i);b.appendChild(t)})}function play(i){let e=a.indexOf(0);if(Math.abs(i-e)===3||(Math.floor(i/3)===Math.floor(e/3)&&Math.abs(i-e)===1)){[a[i],a[e]]=[a[e],a[i]];render();if(a.join(',')==='1,2,3,4,5,6,7,8,0')document.getElementById('msg').textContent='آفرین! برنده شدی 🎉'}}function moveEmpty(){document.getElementById('msg').textContent='فقط خانه‌های چسبیده به مربع خالی را انتخاب کن.'}start();</script></body></html>
